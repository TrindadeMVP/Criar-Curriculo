name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gerar-apk.yml'
      - 'Gerador_Curriculos_APK_PRONTO_PARA_BUILD.zip'

permissions:
  contents: read

jobs:
  android:
    name: Compilar APK de testes
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair código-fonte do ZIP já enviado
        shell: bash
        run: |
          set -euo pipefail
          test -f Gerador_Curriculos_APK_PRONTO_PARA_BUILD.zip
          unzip -oq Gerador_Curriculos_APK_PRONTO_PARA_BUILD.zip
          test -f package.json
          test -f web/index.html
          test -f scripts/prepare-assets.mjs
          echo "Código-fonte extraído com sucesso."

      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Incorporar PDF offline e municípios
        run: npm run assets

      - name: Verificar código e testes unitários
        run: |
          npm run check
          npm run test:unit

      - name: Gerar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          node scripts/android-version.mjs
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Validar APK e assinatura
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:android
          APK="$(find android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p entrega-apk
          cp "$APK" entrega-apk/Gerador-Curriculos-Android-v1.3.2-debug.apk

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: BAIXAR-APK-Gerador-Curriculos
          path: entrega-apk/*.apk
          if-no-files-found: error
          retention-days: 30
