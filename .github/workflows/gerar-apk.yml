name: Currículo Ideal - Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gerar-apk.yml'
      - 'Gerador_Curriculos_APK_PRONTO_PARA_BUILD.zip'
      - 'scripts/upgrade-ideal.mjs'
      - 'scripts/ideal-icon-data.py'
      - 'scripts/ideal-icon-android.py'

permissions:
  contents: read

jobs:
  android:
    name: Compilar APK de testes
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair código-fonte do ZIP já enviado
        shell: bash
        run: |
          set -euo pipefail
          test -f Gerador_Curriculos_APK_PRONTO_PARA_BUILD.zip
          unzip -oq Gerador_Curriculos_APK_PRONTO_PARA_BUILD.zip
          test -f package.json
          test -f web/index.html
          test -f scripts/prepare-assets.mjs
          echo "Código-fonte extraído com sucesso."

      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar SDK Android 35
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Aplicar identidade visual e correções do Currículo Ideal
        run: |
          node scripts/upgrade-ideal.mjs
          python3 scripts/ideal-icon-data.py
          node --check scripts/upgrade-ideal.mjs
          grep -q 'Currículo Ideal' web/index.html
          test -s web/ideal-icon.png

      - name: Incorporar PDF offline e municípios
        run: npm run assets

      - name: Verificar código e testes unitários
        run: |
          npm run check
          npm run test:unit

      - name: Gerar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Aplicar ícone oficial ao Android
        run: |
          python3 -m venv /tmp/curriculo-ideal-venv
          /tmp/curriculo-ideal-venv/bin/pip -q install pillow
          /tmp/curriculo-ideal-venv/bin/python scripts/ideal-icon-android.py

      - name: Compilar APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          node scripts/android-version.mjs
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Validar APK e assinatura
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:android
          APK="$(find android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p entrega-apk
          cp "$APK" entrega-apk/Curriculo-Ideal-Android-v1.4.0-debug.apk

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: BAIXAR-APK-Curriculo-Ideal
          path: entrega-apk/*.apk
          if-no-files-found: error
          retention-days: 30
